# Publica la web de sitio_web/ en GitHub Pages (https://angelfuefer.github.io/OnBudget/).
# Requiere el repo público y Settings → Pages → Source: «GitHub Actions».
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['sitio_web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sitio_web
      - id: despliegue
        uses: actions/deploy-pages@v5
