name: presupuesto_familiar
description: Calculadora de presupuesto familiar
publish_to: 'none'

# El número tras '+' lo sustituye el CI por el nº de ejecución para que cada APK actualice al anterior.
version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_slidable: ^4.0.3
  notification_listener_service: ^1.0.0
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  dart_jsonwebtoken: ^3.4.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/branding/