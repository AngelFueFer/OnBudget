# Compila el APK de Android y lo publica como GitHub Release para descargarlo.
# Se lanza al subir a main, al crear una etiqueta v* o a mano desde la pestaña Actions.
name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # necesario para crear la Release

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Misma versión que figura en .metadata, para builds reproducibles
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - run: flutter pub get
      # Los avisos se muestran pero no bloquean el APK (hay uno previo: falta flutter_lints)
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test

      # Firma con la clave propia si los secretos existen; si no, la build usa la clave debug.
      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin secretos de firma: el APK va firmado con clave debug (cada build puede exigir desinstalar para actualizar)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # build-number creciente: Android solo instala encima si el versionCode no baja
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      # Google Play solo acepta AAB, firmado con la clave de subida (los secretos de arriba)
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          etiqueta="v${version}-build${{ github.run_number }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then etiqueta="${GITHUB_REF_NAME}"; fi
          apk="presupuesto-familiar.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          gh release create "$etiqueta" "$apk" \
            --title "On Budget $etiqueta" \
            --notes "APK compilado desde ${GITHUB_SHA::7}. Instálalo en Android permitiendo «orígenes desconocidos»." \
            --target "$GITHUB_SHA" \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: presupuesto-familiar-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Para subir a Play Console (pestaña Actions → esta ejecución → Artifacts). No va en la Release.
      - uses: actions/upload-artifact@v4
        with:
          name: on-budget-aab
          path: build/app/outputs/bundle/release/app-release.aab
