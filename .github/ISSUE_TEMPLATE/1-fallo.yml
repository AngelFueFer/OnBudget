name: 🐞 Algo no funciona
description: Informa de un fallo de la app
labels: [fallo]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. **No pegues datos reales** (importes, IBAN, tarjetas, claves): cámbialos por otros inventados.
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
      description: Qué esperabas y qué ha ocurrido.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abro…
        2. Pulso…
        3. Aparece…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de la app
      description: Ajustes de Android → Aplicaciones → On Budget.
    validations:
      required: true
  - type: input
    id: movil
    attributes:
      label: Móvil y versión de Android/iOS
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: dropdown
    id: origen
    attributes:
      label: ¿De dónde la instalaste?
      options:
        - Google Play
        - APK de GitHub Releases
        - Compilada por mí
  - type: textarea
    id: capturas
    attributes:
      label: Capturas (opcional)
      description: Sin datos reales, por favor.
