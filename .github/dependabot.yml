# Avisa con un PR cuando hay versiones nuevas de dependencias.
# Mensual y agrupado para no llenar el repo de PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      acciones:
        patterns: ['*']

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      app:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /servidor
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      servidor:
        update-types: [minor, patch]
